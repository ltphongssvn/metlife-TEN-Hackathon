# /metlife-TEN-Hackathon/infrastructure/docker-compose.yml
version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    container_name: metlife-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    env_file:
      - ../backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.frontend
    container_name: metlife-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  agents:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.agents
    container_name: metlife-agents
    ports:
      - "8000:8000"
    env_file:
      - ../agents/.env
    volumes:
      - agent-data:/app/data
    restart: unless-stopped

volumes:
  agent-data:
